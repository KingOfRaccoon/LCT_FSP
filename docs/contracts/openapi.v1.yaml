{
  "openapi": "3.1.0",
  "info": {
    "title": "FSP Talent Platform API",
    "version": "1.0.0",
    "description": "P0 same-origin session API. All JSON DTO fields use snake_case. Public DTOs contain explicit provenance/demo fields and omit contacts, external identity IDs, task answers, keys, and rubrics. See ../23-api-and-data-contract.md for business and privacy rules."
  },
  "servers": [
    {
      "url": "/api/v1",
      "description": "Same-origin API base path"
    }
  ],
  "tags": [
    {
      "name": "Auth"
    },
    {
      "name": "Candidate"
    },
    {
      "name": "Company"
    },
    {
      "name": "Assessment"
    },
    {
      "name": "FSP mock"
    },
    {
      "name": "Needs"
    },
    {
      "name": "Matching"
    },
    {
      "name": "Shortlists"
    },
    {
      "name": "Invitations"
    },
    {
      "name": "Contacts"
    }
  ],
  "paths": {
    "/auth/csrf": {
      "get": {
        "operationId": "get_csrf_token",
        "summary": "Get a CSRF token",
        "tags": [
          "Auth"
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "object",
                      "properties": {
                        "csrf_token": {
                          "type": "string",
                          "maxLength": 256
                        },
                        "expires_at": {
                          "$ref": "#/components/schemas/Timestamp"
                        }
                      },
                      "required": [
                        "csrf_token",
                        "expires_at"
                      ],
                      "additionalProperties": false
                    }
                  },
                  "required": [
                    "data"
                  ],
                  "additionalProperties": false
                }
              }
            },
            "headers": {
              "Set-Cookie": {
                "description": "Server-set opaque session cookie: HttpOnly; SameSite=Lax; Path=/; Secure on HTTPS deployment. Cookie contents are never returned in a response body.",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "description": "Validation error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "401": {
            "description": "Unauthenticated",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "403": {
            "description": "Forbidden",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "404": {
            "description": "Not found or not visible",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "409": {
            "description": "State, idempotency, or optimistic-lock conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "422": {
            "description": "Policy or email-verification precondition",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "429": {
            "description": "Rate limited",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            },
            "headers": {
              "Retry-After": {
                "description": "Seconds until the caller may retry.",
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          },
          "503": {
            "description": "Dependency unavailable; retry only when retryable is true",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          }
        },
        "description": "Creates or reuses a one-hour anonymous pre-auth session and returns its server-stored synchronizer token. The opaque HttpOnly session cookie is set by the server; token is bound to that session. Rotate session and CSRF token after login, then call this endpoint again."
      }
    },
