  "components": {
    "securitySchemes": {
      "session_cookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "fsp_session"
      }
    },
    "schemas": {
      "UUID": {
        "type": "string",
        "format": "uuid"
      },
      "Timestamp": {
        "type": "string",
        "format": "date-time"
      },
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "VALIDATION_ERROR",
              "UNAUTHENTICATED",
              "FORBIDDEN",
              "NOT_FOUND",
              "VERSION_CONFLICT",
              "IDEMPOTENCY_CONFLICT",
              "INVALID_STATE",
              "EMAIL_UNCONFIRMED",
              "POLICY_BLOCKED",
              "ACTIVE_ATTEMPT_EXISTS",
              "RATE_LIMITED",
              "DEPENDENCY_UNAVAILABLE",
              "ATTEMPT_DEADLINE_REACHED",
              "BANK_UNAVAILABLE",
              "CSRF_INVALID",
              "CSRF_ORIGIN_INVALID",
              "EMAIL_ALREADY_EXISTS",
              "PROFILE_INCOMPLETE",
              "INTERNAL_ERROR",
              "INVITATION_COOLDOWN"
            ],
            "maxLength": 64
          },
          "message": {
            "type": "string",
            "maxLength": 500
          },
          "field": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 100
              },
              {
                "type": "null"
              }
            ]
          },
          "retryable": {
            "type": "boolean"
          },
          "current_version": {
            "anyOf": [
              {
                "type": "integer",
                "minimum": 1
              },
              {
                "type": "null"
              }
            ]
          },
          "eligible_at": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Timestamp"
              },
              {
                "type": "null"
              }
            ]
          },
          "active_attempt_id": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/UUID"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "code",
          "message",
          "retryable",
          "eligible_at",
          "active_attempt_id"
        ],
        "additionalProperties": false
      },
      "ErrorEnvelope": {
        "type": "object",
        "properties": {
          "error": {
            "$ref": "#/components/schemas/Error"
          }
        },
        "required": [
          "error"
        ],
        "additionalProperties": false
      },
      "MoneyRange": {
        "type": "object",
        "properties": {
          "min_kopecks": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100000000000
          },
          "max_kopecks": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100000000000
          },
          "currency": {
            "const": "RUB"
          },
          "period": {
            "const": "month"
          },
          "basis": {
            "type": "string",
            "enum": [
              "gross",
              "net"
            ]
          },
          "workload_type": {
            "type": "string",
            "enum": [
              "full_time",
              "part_time"
            ]
          },
          "hours_per_week": {
            "type": "integer",
            "minimum": 1,
            "maximum": 40
          }
        },
        "required": [
          "min_kopecks",
          "max_kopecks",
          "currency",
          "period",
          "basis",
          "workload_type",
          "hours_per_week"
        ],
        "additionalProperties": false,
        "description": "RUB monthly salary as a positive integer number of kopecks. Enforce 0 < min_kopecks <= max_kopecks. Fields are workload_type and hours_per_week; hours_per_week equals the need workload_hours_per_week. full_time requires 40 hours/week; part_time requires 1..39."
      },
      "DeclaredSkill": {
        "type": "object",
        "properties": {
          "skill_id": {
            "type": "string",
            "enum": [
              "python-basics",
              "http-api",
              "sql-transactions",
              "reliability",
              "postgres",
              "docker",
              "fastapi"
            ]
          },
          "provenance": {
            "const": "candidate_declared"
          }
        },
        "required": [
          "skill_id",
          "provenance"
        ],
        "additionalProperties": false
      },
      "CandidatePrivate": {
        "type": "object",
        "properties": {
          "id": {
            "$ref": "#/components/schemas/UUID"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "display_name": {
            "type": "string",
            "maxLength": 120
          },
          "headline": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 160
              },
              {
                "type": "null"
              }
            ]
          },
          "summary": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 2000
              },
              {
                "type": "null"
              }
            ]
          },
          "specialization_id": {
            "type": "string",
            "enum": [
              "backend-python-v1"
            ]
          },
          "declared_grade": {
            "anyOf": [
              {
                "type": "string",
                "enum": [
                  "junior",
                  "middle"
                ]
              },
              {
                "type": "null"
              }
            ]
          },
          "verified_grade": {
            "anyOf": [
              {
                "type": "string",
                "enum": [
                  "junior",
                  "middle"
                ]
              },
              {
                "type": "null"
              }
            ]
          },
          "visibility": {
            "type": "string",
            "enum": [
              "hidden",
              "public"
            ]
          },
          "allowed_work_modes": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "remote",
                "hybrid",
                "office"
              ]
            },
            "minItems": 0,
            "maxItems": 3
          },
          "cities": {
            "type": "array",
            "items": {
              "type": "string",
              "maxLength": 100
            },
            "minItems": 0,
            "maxItems": 30
          },
          "desired_hours_per_week": {
            "anyOf": [
              {
                "type": "integer",
                "minimum": 1,
