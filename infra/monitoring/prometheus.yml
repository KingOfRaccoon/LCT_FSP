global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fsp-api
    metrics_path: /api/v1/operations/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/fsp_metrics_token
    static_configs:
      - targets: ["api:8000"]
