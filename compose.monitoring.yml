services:
  api:
    environment:
      FSP_METRICS_TOKEN_FILE: /run/secrets/fsp_metrics_token
    secrets:
      - fsp_metrics_token

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    group_add:
      - "${FSP_MONITORING_SECRET_GID:-0}"
    secrets:
      - fsp_metrics_token
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    group_add:
      - "${FSP_MONITORING_SECRET_GID:-0}"
    secrets:
      - grafana_admin_password
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

secrets:
  fsp_metrics_token:
    file: ${FSP_METRICS_TOKEN_FILE:-./local/monitoring/fsp_metrics_token}
  grafana_admin_password:
    file: ${FSP_GRAFANA_ADMIN_PASSWORD_FILE:-./local/monitoring/grafana_admin_password}
