server:
  port: ${SERVER_PORT:8000}
  forward-headers-strategy: framework
  error:
    include-message: never

spring:
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  application:
    name: fsp-talent-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/fsp_dev}
    username: ${DATABASE_USERNAME:fsp}
    password: ${DATABASE_PASSWORD:fsp_demo}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLE:false}
      mail.smtp.connectiontimeout: 3000
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

fsp:
  demo-mode: ${FSP_DEMO_MODE:true}
  session-secret: ${SESSION_SECRET:local-demo-session-secret-change-before-deploy-2026}
  public-origin: ${PUBLIC_ORIGIN:http://localhost:5173}
  session-cookie-secure: ${SESSION_COOKIE_SECURE:false}
  company-verification:
    registry-mode: ${COMPANY_VERIFICATION_PROVIDER:manual}
    dadata-token: ${DADATA_TOKEN:}
  monitoring:
    scrape-token: ${FSP_METRICS_TOKEN:}
    scrape-token-file: ${FSP_METRICS_TOKEN_FILE:}
